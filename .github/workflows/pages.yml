name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Fetch alerts
        run: node scripts/fetch-alerts.mjs
        env:
          MISSING_PERSON_RELEVANCE_THRESHOLD: "0"
          FAIL_ON_CRITICAL_SOURCE_GAP: "0"
          CRITICAL_SOURCE_PREFIXES: "interpol-red,interpol-yellow"

      - name: Build
        run: npm run build
        env:
          BASE_PATH: "/osint-siem/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
